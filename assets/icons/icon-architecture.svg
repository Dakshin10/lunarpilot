<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-arch" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020d1a" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="layer-top1" x1="16" y1="8" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="layer-side1" x1="16" y1="20" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="layer-top2" x1="16" y1="22" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="layer-side2" x1="16" y1="34" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <linearGradient id="layer-top3" x1="16" y1="36" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="layer-side3" x1="16" y1="48" x2="48" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <!-- Bottom Tier (Layer 3 - Green/Env) -->
  <g filter="url(#shadow-arch)">
    <polygon points="32,46 56,36 32,26 8,36" fill="url(#layer-top3)"/>
    <polygon points="8,36 32,46 32,52 8,42" fill="url(#layer-side3)"/>
    <polygon points="32,46 56,36 56,42 32,52" fill="#064e3b"/>
  </g>

  <!-- Middle Tier (Layer 2 - Purple/Avionics) -->
  <g filter="url(#shadow-arch)">
    <polygon points="32,32 56,22 32,12 8,22" fill="url(#layer-top2)"/>
    <polygon points="8,22 32,32 32,37 8,27" fill="url(#layer-side2)"/>
    <polygon points="32,32 56,22 56,27 32,37" fill="#312e81"/>
  </g>

  <!-- Top Tier (Layer 1 - Cyan/Policy Core) -->
  <g filter="url(#shadow-arch)">
    <polygon points="32,18 56,8 32,-2 8,8" fill="url(#layer-top1)" transform="translate(0, 8)"/>
    <polygon points="8,16 32,26 32,31 8,21" fill="url(#layer-side1)"/>
    <polygon points="32,26 56,16 56,21 32,31" fill="#0c4a6e"/>
  </g>

  <!-- Glowing Central Data Column & Interconnects -->
  <line x1="32" y1="12" x2="32" y2="42" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="3.5" fill="#ffffff" filter="url(#shadow-arch)"/>
  <circle cx="32" cy="12" r="2" fill="#0284c7"/>
  <circle cx="32" cy="27" r="2.5" fill="#ffffff"/>
  <circle cx="32" cy="41" r="2.5" fill="#ffffff"/>

  <!-- Circuit Trace Accents -->
  <polyline points="20,11 26,14 26,18" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="20" cy="11" r="1.5" fill="#ffffff"/>
  <polyline points="44,11 38,14 38,18" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="44" cy="11" r="1.5" fill="#ffffff"/>
</svg>

