<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-tel" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020d1a" flood-opacity="0.6"/>
    </filter>
    <!-- Bar 1 Gradients (Cyan) -->
    <linearGradient id="bar1-top" x1="12" y1="28" x2="22" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="bar1-side" x1="12" y1="34" x2="22" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#0b5e58"/>
    </linearGradient>

    <!-- Bar 2 Gradients (Blue) -->
    <linearGradient id="bar2-top" x1="26" y1="18" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="bar2-side" x1="26" y1="24" x2="38" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066eb"/>
      <stop offset="100%" stop-color="#00358a"/>
    </linearGradient>

    <!-- Bar 3 Gradients (Purple/Magenta) -->
    <linearGradient id="bar3-top" x1="42" y1="8" x2="54" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="bar3-side" x1="42" y1="14" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Base Plate Gradient -->
    <linearGradient id="base-plate" x1="6" y1="46" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- 3D Pedestal Platform -->
  <polygon points="32,46 58,54 32,62 6,54" fill="url(#base-plate)" filter="url(#shadow-tel)"/>
  <polygon points="32,46 6,54 6,56 32,64 58,56 58,54" fill="#090d16" opacity="0.6"/>

  <!-- Bar 1 (Left) -->
  <polygon points="17,32 23,35 23,53 17,50" fill="url(#bar1-side)"/>
  <polygon points="11,35 17,32 17,50 11,53" fill="url(#bar1-top)" opacity="0.8"/>
  <polygon points="17,29 23,32 17,35 11,32" fill="url(#bar1-top)"/>

  <!-- Bar 2 (Center) -->
  <polygon points="32,22 39,26 39,53 32,49" fill="url(#bar2-side)"/>
  <polygon points="25,26 32,22 32,49 25,53" fill="url(#bar2-top)" opacity="0.85"/>
  <polygon points="32,18 39,22 32,26 25,22" fill="url(#bar2-top)"/>

  <!-- Bar 3 (Right - Highest) -->
  <polygon points="48,12 55,16 55,53 48,49" fill="url(#bar3-side)"/>
  <polygon points="41,16 48,12 48,49 41,53" fill="url(#bar3-top)" opacity="0.85"/>
  <polygon points="48,8 55,12 48,16 41,12" fill="url(#bar3-top)"/>

  <!-- 3D Dynamic Sparkline Arrow -->
  <polyline points="14,24 28,14 44,4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="47,3 41,3 45,7" fill="#ffffff"/>
  <!-- Glowing Nodes -->
  <circle cx="14" cy="24" r="2.5" fill="#38ef7d"/>
  <circle cx="28" cy="14" r="2.5" fill="#00f2fe"/>
  <circle cx="44" cy="4" r="3" fill="#ff3366"/>
</svg>
