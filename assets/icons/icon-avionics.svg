<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-avionics" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020d1a" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="busBody" x1="22" y1="20" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="solarWing" x1="4" y1="26" x2="20" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="radarDish" x1="24" y1="8" x2="40" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Left Solar Array Panel (Isometric 3D) -->
  <polygon points="6,24 20,28 20,38 6,34" fill="url(#solarWing)" filter="url(#shadow-avionics)"/>
  <!-- Solar Cells Grid -->
  <line x1="13" y1="26" x2="13" y2="36" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="6" y1="29" x2="20" y2="33" stroke="#38bdf8" stroke-width="0.8"/>
  <!-- Boom Arm -->
  <line x1="20" y1="33" x2="24" y2="33" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Right Solar Array Panel (Isometric 3D) -->
  <polygon points="44,28 58,24 58,34 44,38" fill="url(#solarWing)" filter="url(#shadow-avionics)"/>
  <!-- Solar Cells Grid -->
  <line x1="51" y1="26" x2="51" y2="36" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="44" y1="33" x2="58" y2="29" stroke="#38bdf8" stroke-width="0.8"/>
  <!-- Boom Arm -->
  <line x1="40" y1="33" x2="44" y2="33" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Central Avionics Bus Core (3D Gold Cube) -->
  <polygon points="32,22 42,28 42,42 32,48 22,42 22,28" fill="url(#busBody)" filter="url(#shadow-avionics)"/>
  <!-- Top Surface Facet -->
  <polygon points="32,22 42,28 32,34 22,28" fill="#fef08a"/>
  <!-- Right Wall Facet -->
  <polygon points="32,34 42,28 42,42 32,48" fill="#b45309"/>
  <!-- Left Wall Facet -->
  <polygon points="32,34 22,28 22,42 32,48" fill="#d97706"/>

  <!-- Steerable High-Gain Parabolic Dish (Top) -->
  <path d="M25,16 Q32,8 39,16 Z" fill="url(#radarDish)" filter="url(#shadow-avionics)"/>
  <line x1="32" y1="12" x2="32" y2="22" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="32" cy="11" r="2" fill="#0284c7"/>

  <!-- Sensor Optical Aperture / Star Tracker (Front) -->
  <circle cx="32" cy="40" r="3.5" fill="#0f172a" stroke="#00f5d4" stroke-width="1.2"/>
  <circle cx="32" cy="40" r="1.5" fill="#00f5d4"/>
</svg>
