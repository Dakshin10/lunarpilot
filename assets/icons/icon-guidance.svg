<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-rocket" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020d1a" flood-opacity="0.6"/>
    </filter>
    <!-- Capsule Gradient -->
    <linearGradient id="capsuleGrad" x1="20" y1="8" x2="44" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Gold Foil Base Gradient -->
    <linearGradient id="goldFoil" x1="16" y1="28" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <!-- Flame Plume Gradient -->
    <linearGradient id="flameGrad" x1="32" y1="42" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Exhaust Flame & Shock Diamonds -->
  <polygon points="32,62 26,43 38,43" fill="url(#flameGrad)" opacity="0.95"/>
  <polygon points="32,54 29,43 35,43" fill="#ffffff" opacity="0.9"/>

  <!-- Landing Struts (Left & Right with Footpads) -->
  <line x1="20" y1="36" x2="10" y2="52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="10" y2="52" stroke="#64748b" stroke-width="1.8"/>
  <ellipse cx="10" cy="53" rx="4" ry="1.5" fill="#475569"/>

  <line x1="44" y1="36" x2="54" y2="52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="38" x2="54" y2="52" stroke="#64748b" stroke-width="1.8"/>
  <ellipse cx="54" cy="53" rx="4" ry="1.5" fill="#475569"/>

  <!-- Main Engine Bell -->
  <polygon points="26,43 38,43 35,38 29,38" fill="#334155"/>

  <!-- Gold Foil Descent Stage (Octagonal 3D Box) -->
  <path d="M18,30 L46,30 L50,40 L14,40 Z" fill="url(#goldFoil)" filter="url(#shadow-rocket)"/>
  <line x1="14" y1="40" x2="50" y2="40" stroke="#713f12" stroke-width="1"/>
  <!-- Foil Facet lines -->
  <line x1="26" y1="30" x2="24" y2="40" stroke="#ca8a04" stroke-width="1"/>
  <line x1="38" y1="30" x2="40" y2="40" stroke="#ca8a04" stroke-width="1"/>

  <!-- Crew Capsule / Ascent Stage (3D Dome) -->
  <path d="M22,30 L42,30 L38,14 L26,14 Z" fill="url(#capsuleGrad)" filter="url(#shadow-rocket)"/>
  <!-- Capsule Top Cap -->
  <ellipse cx="32" cy="14" rx="6" ry="2" fill="#e2e8f0"/>

  <!-- Cockpit Visor / Glass Window (Cyan 3D Glare) -->
  <polygon points="28,20 36,20 38,24 26,24" fill="#0284c7"/>
  <polygon points="29,21 35,21 37,23 27,23" fill="#38bdf8"/>
  <line x1="32" y1="20" x2="32" y2="24" stroke="#0369a1" stroke-width="0.8"/>

  <!-- RCS Thruster Quads (Left & Right) -->
  <rect x="18" y="24" width="4" height="2" rx="0.5" fill="#475569"/>
  <rect x="42" y="24" width="4" height="2" rx="0.5" fill="#475569"/>
  <!-- RCS Plume Sparks -->
  <circle cx="16" cy="25" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="48" cy="25" r="1.5" fill="#38bdf8" opacity="0.8"/>
</svg>

