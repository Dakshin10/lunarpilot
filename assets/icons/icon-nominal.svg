<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <radialGradient id="grad-nom" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <filter id="glow-nom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 3D Sphere -->
  <circle cx="16" cy="16" r="13" fill="url(#grad-nom)" filter="url(#glow-nom)"/>
  <!-- Specular Glare -->
  <ellipse cx="12" cy="11" rx="5" ry="2.5" transform="rotate(-30 12 11)" fill="#ffffff" opacity="0.75"/>
</svg>
