<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-bolt" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#451a03" flood-opacity="0.6"/>
    </filter>
    <!-- Facet 1 (Left / Lit side) -->
    <linearGradient id="boltLit" x1="18" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Facet 2 (Right / Shadow side) -->
    <linearGradient id="boltShade" x1="28" y1="16" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Background Halo Glow -->
    <radialGradient id="haloGlow" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Energy Halo Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#haloGlow)"/>

  <!-- 3D Lightning Bolt Structure -->
  <g filter="url(#shadow-bolt)">
    <!-- Main 3D Extruded Body -->
    <polygon points="36,6 18,34 32,34 26,58 48,26 34,26" fill="url(#boltLit)"/>
    
    <!-- 3D Beveled Shadow Edge -->
    <polygon points="36,6 34,26 48,26 44,28 32,28 35,8" fill="url(#boltShade)"/>
    <polygon points="32,34 26,58 29,54 34,36" fill="url(#boltShade)"/>
  </g>

  <!-- Specular High-Voltage Glint on Crest -->
  <circle cx="33" cy="26" r="3" fill="#ffffff"/>
  <circle cx="33" cy="26" r="5" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
</svg>
