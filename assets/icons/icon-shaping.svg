<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-brain" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b0764" flood-opacity="0.5"/>
    </filter>
    <!-- Left Hemisphere 3D Gradient -->
    <linearGradient id="brainLeft" x1="12" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <!-- Right Hemisphere 3D Gradient -->
    <linearGradient id="brainRight" x1="52" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <!-- Synapse Glow -->
    <linearGradient id="synapseGlow" x1="20" y1="14" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>

  <!-- Left Hemisphere 3D Lobes -->
  <path d="M30,12 C24,12 18,15 15,20 C12,25 12,30 14,35 C12,38 12,44 16,48 C20,52 26,52 30,51 Z" fill="url(#brainLeft)" filter="url(#shadow-brain)"/>
  
  <!-- Right Hemisphere 3D Lobes -->
  <path d="M34,12 C40,12 46,15 49,20 C52,25 52,30 50,35 C52,38 52,44 48,48 C44,52 38,52 34,51 Z" fill="url(#brainRight)" filter="url(#shadow-brain)"/>

  <!-- Specular Highlights on Top Curves -->
  <path d="M19,17 C22,14 27,13 30,13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M45,17 C42,14 37,13 34,13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Neural Core Central Fissure Glow -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>

  <!-- Synaptic Network Nodes & Axons -->
  <circle cx="23" cy="22" r="3" fill="#00f5d4"/>
  <circle cx="20" cy="35" r="2.5" fill="#38bdf8"/>
  <circle cx="26" cy="44" r="2.5" fill="#38bdf8"/>
  <line x1="23" y1="22" x2="20" y2="35" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="20" y1="35" x2="26" y2="44" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="23" y1="22" x2="32" y2="28" stroke="#00f5d4" stroke-width="1.5"/>

  <circle cx="41" cy="22" r="3" fill="#f472b6"/>
  <circle cx="44" cy="35" r="2.5" fill="#fb7185"/>
  <circle cx="38" cy="44" r="2.5" fill="#fb7185"/>
  <line x1="41" y1="22" x2="44" y2="35" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="44" y1="35" x2="38" y2="44" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="41" y1="22" x2="32" y2="28" stroke="#f472b6" stroke-width="1.5"/>

  <!-- Central Quantum Learning Nucleus -->
  <circle cx="32" cy="28" r="4.5" fill="#ffffff" filter="url(#shadow-brain)"/>
  <circle cx="32" cy="28" r="2.5" fill="#00f5d4"/>
</svg>
