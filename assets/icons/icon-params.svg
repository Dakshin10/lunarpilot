<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-gear" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020d1a" flood-opacity="0.6"/>
    </filter>
    <!-- Gear Rim Gradient -->
    <linearGradient id="gearGold" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <radialGradient id="gearCenter" cx="32" cy="32" r="18" fx="28" fy="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <!-- Sliders / Pots -->
    <linearGradient id="knobGrad" x1="26" y1="26" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 3D Precision Spur Gear Base -->
  <g filter="url(#shadow-gear)">
    <!-- 8 Cog Teeth -->
    <rect x="29" y="6" width="6" height="52" rx="2" fill="url(#gearGold)"/>
    <rect x="29" y="6" width="6" height="52" rx="2" transform="rotate(45 32 32)" fill="url(#gearGold)"/>
    <rect x="29" y="6" width="6" height="52" rx="2" transform="rotate(90 32 32)" fill="url(#gearGold)"/>
    <rect x="29" y="6" width="6" height="52" rx="2" transform="rotate(135 32 32)" fill="url(#gearGold)"/>
    
    <!-- Outer Wheel Rim -->
    <circle cx="32" cy="32" r="21" fill="url(#gearGold)"/>
    <!-- Rim Chamfer Inner Shadow -->
    <circle cx="32" cy="32" r="17" fill="#713f12" opacity="0.3"/>
  </g>

  <!-- Metallic Central Hub -->
  <circle cx="32" cy="32" r="14" fill="url(#gearCenter)" filter="url(#shadow-gear)"/>

  <!-- Dial Tuning Notch / Indicator -->
  <circle cx="32" cy="32" r="9" fill="url(#knobGrad)"/>
  <line x1="32" y1="32" x2="32" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Indicator Calibration Pip Rings -->
  <circle cx="32" cy="18" r="1.5" fill="#ca8a04"/>
  <circle cx="42" cy="22" r="1.5" fill="#ca8a04"/>
  <circle cx="46" cy="32" r="1.5" fill="#ca8a04"/>
</svg>

