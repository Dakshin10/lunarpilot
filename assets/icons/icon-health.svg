<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-shield" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#022c22" flood-opacity="0.6"/>
    </filter>
    <!-- Outer Titanium Shield Rim -->
    <linearGradient id="shieldRim" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <!-- Inner Energy Matrix -->
    <radialGradient id="shieldCore" cx="32" cy="28" r="22" fx="28" fy="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <!-- Specular Bevel -->
    <linearGradient id="shieldHighlight" x1="32" y1="10" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 3D Shield Base Shell -->
  <path d="M32,8 L50,14 C50,32 44,48 32,58 C20,48 14,32 14,14 Z" fill="url(#shieldRim)" filter="url(#shadow-shield)"/>

  <!-- Inner Recessed Core -->
  <path d="M32,12 L46,17 C46,32 41,45 32,53 C23,45 18,32 18,17 Z" fill="url(#shieldCore)"/>

  <!-- Left/Top Rim 3D Bevel -->
  <path d="M32,8 L50,14 L46,17 L32,12 L18,17 L14,14 Z" fill="url(#shieldHighlight)"/>

  <!-- Central Structural Health Cross / Landing Gear Symbol -->
  <g filter="url(#shadow-shield)">
    <polygon points="32,20 36,26 42,26 38,31 40,38 32,34 24,38 26,31 22,26 28,26" fill="#ffffff" opacity="0.95"/>
    <polygon points="32,22 35,27 40,27 36,31 38,36 32,33 26,36 28,31 24,27 29,27" fill="#ecfdf5"/>
    <!-- Central Sensor Dot -->
    <circle cx="32" cy="30" r="2" fill="#059669"/>
  </g>

  <!-- Lower Reinforcement Ribs -->
  <line x1="26" y1="42" x2="32" y2="48" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="42" x2="32" y2="48" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
</svg>

