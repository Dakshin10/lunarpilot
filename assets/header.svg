<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Space+Grotesk:wght@500;700;800&amp;display=swap');

      .bg { fill: #0B0F19; stroke: #1E293B; stroke-width: 1.5; rx: 16px; }
      .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; font-size: 40px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .title-accent { fill: #A855F7; }
      .subtitle { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; fill: #38BDF8; letter-spacing: 2.5px; text-transform: uppercase; }
      .desc { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; font-size: 15px; fill: #94A3B8; }
      
      .tag-bg { fill: #1E293B; rx: 6px; }
      .tag-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #E2E8F0; letter-spacing: 0.5px; }

      .hover-item {
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
        cursor: pointer;
      }
      .hover-item:hover {
        transform: translateY(-4px);
      }
      .hover-item:hover .card-border {
        stroke: #A855F7;
        stroke-width: 1.5;
      }
      .hover-item:hover .card-bg {
        fill: #1E2433;
      }

      .card-bg { fill: #131A29; rx: 10px; transition: fill 0.2s ease; }
      .card-border { stroke: #26334D; stroke-width: 1; transition: stroke 0.2s ease; }
      .metric-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #94A3B8; letter-spacing: 1px; text-transform: uppercase; }
      .metric-val { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 18px; fill: #FFFFFF; }
      .metric-val-green { fill: #10B981; }
      .metric-val-purple { fill: #C084FC; }
      .metric-val-blue { fill: #38BDF8; }

      .lander-body { fill: #7C3AED; stroke: #A78BFA; stroke-width: 1.5; }
      .lander-cabin { fill: #1E1B4B; stroke: #38BDF8; stroke-width: 1.5; }
      .lander-leg { stroke: #94A3B8; stroke-width: 2.5; stroke-linecap: round; }
      .lander-foot { fill: #E2E8F0; }
      .lander-engine { fill: #334155; stroke: #64748B; stroke-width: 1; }
      .flame-core { fill: #F59E0B; }
      .flame-spark { fill: #EF4444; }

      .beacon {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Clean Tech Container -->
  <rect x="2" y="2" width="956" height="226" class="bg" />

  <!-- Grid Accents (Subtle Cadence Lines, Flat) -->
  <line x1="40" y1="2" x2="40" y2="228" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="560" y1="2" x2="560" y2="228" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4" />

  <!-- LEFT SECTION: Branding & Mission Info -->
  <!-- Mission Pill -->
  <g transform="translate(50, 32)">
    <rect width="180" height="24" rx="12" fill="#1E293B" />
    <circle cx="14" cy="12" r="4" fill="#10B981" class="beacon" />
    <text x="26" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">PROJECT // LUNARPILOT</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="98" class="title">LunarPilot<tspan class="title-accent">.rl</tspan></text>

  <!-- Subtitle -->
  <text x="50" y="125" class="subtitle">Autonomous Precision Lunar Lander</text>

  <!-- Short Description -->
  <text x="50" y="152" class="desc">Deep Reinforcement Learning via PPO &amp; Potential-Based Reward Shaping</text>

  <!-- Feature Tags (Flat Pills) -->
  <g transform="translate(50, 175)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="82" height="24" class="tag-bg" />
    <text x="12" y="16" class="tag-text">PPO CLI</text>

    <!-- Tag 2 -->
    <rect x="92" y="0" width="138" height="24" class="tag-bg" />
    <text x="104" y="16" class="tag-text">GYMNASIUM V1.4</text>

    <!-- Tag 3 -->
    <rect x="240" y="0" width="118" height="24" class="tag-bg" />
    <text x="252" y="16" class="tag-text">ZERO-OVERSHOOT</text>
  </g>

  <!-- RIGHT SECTION: Hovering Lander Illustration + 3 Hover Telemetry Cards -->

  <!-- Vector Lunar Lander (Hovering Position) -->
  <g transform="translate(595, 30)">
    <!-- Main Thruster Plume (Flame Particles) -->
    <path d="M 50 72 L 44 94 L 50 102 L 56 94 Z" class="flame-core" />
    <circle cx="50" cy="107" r="3" class="flame-spark" />
    <circle cx="47" cy="115" r="2" class="flame-spark" />
    <circle cx="53" cy="114" r="1.5" class="flame-spark" />

    <!-- Side Thruster RCS Puffs -->
    <circle cx="16" cy="46" r="2.5" class="flame-spark" />
    <circle cx="10" cy="46" r="1.5" class="flame-spark" />
    <circle cx="84" cy="46" r="2.5" class="flame-spark" />
    <circle cx="90" cy="46" r="1.5" class="flame-spark" />

    <!-- Main Engine Bell -->
    <polygon points="42,66 58,66 54,73 46,73" class="lander-engine" />

    <!-- Left Leg Strut & Footpad -->
    <line x1="32" y1="58" x2="16" y2="82" class="lander-leg" />
    <line x1="16" y1="82" x2="8" y2="84" class="lander-leg" />
    <rect x="4" y="83" width="12" height="3" rx="1.5" class="lander-foot" />

    <!-- Right Leg Strut & Footpad -->
    <line x1="68" y1="58" x2="84" y2="82" class="lander-leg" />
    <line x1="84" y1="82" x2="92" y2="84" class="lander-leg" />
    <rect x="84" y="83" width="12" height="3" rx="1.5" class="lander-foot" />

    <!-- Central Chassis (Octagonal Craft Body) -->
    <polygon points="30,28 70,28 78,44 78,64 68,68 32,68 22,64 22,44" class="lander-body" />

    <!-- Cockpit Glass / Viewport -->
    <ellipse cx="50" cy="46" rx="12" ry="9" class="lander-cabin" />

    <!-- Antenna / Sensor Mast -->
    <line x1="50" y1="28" x2="50" y2="16" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="50" cy="14" r="2.5" fill="#38BDF8" />

    <!-- RCS Side Pods -->
    <rect x="18" y="44" width="4" height="6" fill="#475569" />
    <rect x="78" y="44" width="4" height="6" fill="#475569" />
  </g>

  <!-- 3 HOVER CARDS (Right Side Telemetry) -->
  
  <!-- Hover Card 1: Success Rate -->
  <g class="hover-item" transform="translate(720, 26)">
    <rect width="200" height="52" class="card-bg card-border" />
    <circle cx="20" cy="26" r="6" fill="#10B981" />
    <text x="36" y="22" class="metric-label">Landing Rate</text>
    <text x="36" y="42" class="metric-val metric-val-green">100% SUCCESS</text>
  </g>

  <!-- Hover Card 2: Precision -->
  <g class="hover-item" transform="translate(720, 88)">
    <rect width="200" height="52" class="card-bg card-border" />
    <circle cx="20" cy="26" r="6" fill="#38BDF8" />
    <text x="36" y="22" class="metric-label">Touchdown Deviation</text>
    <text x="36" y="42" class="metric-val metric-val-blue">x = 0.00 BULLSEYE</text>
  </g>

  <!-- Hover Card 3: Episode Return -->
  <g class="hover-item" transform="translate(720, 150)">
    <rect width="200" height="52" class="card-bg card-border" />
    <circle cx="20" cy="26" r="6" fill="#C084FC" />
    <text x="36" y="22" class="metric-label">Mean Return</text>
    <text x="36" y="42" class="metric-val metric-val-purple">+330 PTS (SOLVED)</text>
  </g>

</svg>
