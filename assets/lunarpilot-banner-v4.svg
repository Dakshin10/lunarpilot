<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">LunarPilot.rl: Autonomous Precision Lunar Lander</title>
  <desc id="d">Project banner for LunarPilot.rl with key results and a 3D-style lunar lander hovering over a glowing helipad.</desc>
  <defs>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cabinL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8da6"/>
      <stop offset="1" stop-color="#a9b7cb"/>
    </linearGradient>
    <linearGradient id="cabinC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd7e5"/>
    </linearGradient>
    <linearGradient id="cabinR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3c0d3"/>
      <stop offset="1" stop-color="#6f7f98"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.35" stop-color="#fcd34d"/>
      <stop offset="0.75" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b0c0"/>
      <stop offset="1" stop-color="#707d90"/>
    </linearGradient>
    <radialGradient id="padGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="round"><rect width="1400" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Backgrounds -->
    <rect width="1400" height="400" fill="#06090f"/>
    <rect x="16" y="16" width="1368" height="368" rx="30" fill="#0a0e17" stroke="#1b2740" stroke-width="2"/>

    <!-- Subtle stars -->
    <g fill="#ffffff">
      <circle cx="880" cy="60" r="1.2" opacity=".5"/>
      <circle cx="960" cy="120" r="1.1" opacity=".5"/>
      <circle cx="1290" cy="70" r="1.4" opacity=".6"/>
      <circle cx="1340" cy="150" r="1" opacity=".5"/>
      <circle cx="900" cy="330" r="1" opacity=".4"/>
      <circle cx="1330" cy="320" r="1.2" opacity=".4"/>
      <circle cx="850" cy="220" r="1.1" opacity=".4"/>
      <circle cx="1000" cy="48" r="1.6" opacity=".9">
        <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1345" cy="240" r="1.6" opacity=".9">
        <animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="270" r="1.5" opacity=".9">
        <animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ HEADING ============ -->
    <!-- project pill -->
    <rect x="64" y="58" width="262" height="38" rx="19" fill="#151d2e"/>
    <circle cx="87" cy="77" r="6" fill="#12a37f">
      <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="83" textLength="204" lengthAdjust="spacing" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#38bdf8">PROJECT // LUNARPILOT</text>

    <!-- title -->
    <text x="60" y="184" textLength="650" lengthAdjust="spacingAndGlyphs" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="900" fill="#ffffff">LunarPilot<tspan fill="url(#rl)">.rl</tspan></text>

    <!-- tagline (mono, spaced) -->
    <text x="64" y="228" textLength="650" lengthAdjust="spacing" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" font-weight="700" fill="#38bdf8">AUTONOMOUS PRECISION LUNAR LANDER</text>

    <!-- description -->
    <text x="64" y="272" textLength="720" lengthAdjust="spacingAndGlyphs" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#94a3b8">Deep Reinforcement Learning via PPO &amp; Potential-Based Reward Shaping</text>

    <!-- chips -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#e2e8f0">
      <rect x="64" y="304" width="124" height="40" rx="10" fill="#151d2e"/>
      <text x="126" y="330" text-anchor="middle">PPO CLI</text>
      <rect x="200" y="304" width="204" height="40" rx="10" fill="#151d2e"/>
      <text x="302" y="330" text-anchor="middle">GYMNASIUM V1.4</text>
      <rect x="416" y="304" width="196" height="40" rx="10" fill="#151d2e"/>
      <text x="514" y="330" text-anchor="middle">ZERO-OVERSHOOT</text>
    </g>

    <!-- ============ 3D SCENE (scaled into the middle) ============ -->
    <g transform="translate(1115 204) scale(0.9) translate(-965 -215)">

      <!-- slab side faces -->
      <path d="M790 305 L965 360 L965 395 L790 340 Z" fill="#454f62" stroke="#2f3747" stroke-width="2" stroke-linejoin="round"/>
      <path d="M965 360 L1140 305 L1140 340 L965 395 Z" fill="#5a6579" stroke="#2f3747" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="#2f3747" stroke-width="1.5" opacity=".6" fill="none">
        <path d="M830 330 L835 350"/><path d="M880 345 L885 365"/><path d="M925 358 L930 378"/>
        <path d="M1010 372 L1015 352"/><path d="M1070 350 L1075 330"/><path d="M1110 336 L1112 318"/>
      </g>
      <!-- slab top -->
      <path d="M790 305 L965 255 L1140 305 L965 360 Z" fill="url(#topFace)" stroke="#b6c0cf" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="965" cy="308" rx="110" ry="36" fill="#5f6b7e" opacity=".5"/>
      <g fill="#8b97a9" stroke="#566176" stroke-width="1.2">
        <ellipse cx="830" cy="305" rx="10" ry="5"/>
        <ellipse cx="880" cy="285" rx="12" ry="6"/>
        <ellipse cx="1000" cy="275" rx="9" ry="4.5"/>
        <ellipse cx="1090" cy="300" rx="11" ry="5"/>
        <ellipse cx="1050" cy="330" rx="12" ry="6"/>
        <ellipse cx="910" cy="338" rx="10" ry="5"/>
        <ellipse cx="1115" cy="306" rx="6" ry="3"/>
      </g>

      <!-- pad -->
      <ellipse cx="965" cy="310" rx="110" ry="34" fill="url(#padGlow)">
        <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="965" cy="310" rx="82" ry="28" fill="none" stroke="#34d399" stroke-width="3"/>
      <ellipse cx="965" cy="310" rx="82" ry="28" fill="none" stroke="#a7f3d0" stroke-width="2">
        <animate attributeName="rx" values="70;96;70" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="23;33;23" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="965" cy="310" rx="52" ry="17" fill="none" stroke="#34d399" stroke-width="2" opacity=".8"/>
      <text transform="translate(965 318) scale(1 0.45)" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="40" font-weight="800" fill="#d1fae5" opacity=".9">H</text>

      <!-- guidance beam -->
      <line x1="965" y1="248" x2="965" y2="300" stroke="#34d399" stroke-width="2" stroke-dasharray="3 6" opacity=".85">
        <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
      </line>

      <!-- lander -->
      <g transform="translate(965 128)">
        <animateTransform attributeName="transform" type="translate" values="965 124;965 134;965 124" dur="3s" repeatCount="indefinite"/>

        <ellipse cx="0" cy="78" rx="34" ry="46" fill="#fb923c" opacity=".55" filter="url(#blur)">
          <animate attributeName="opacity" values=".4;.7;.45;.65;.4" dur="0.5s" repeatCount="indefinite"/>
        </ellipse>

        <!-- back legs -->
        <g stroke-linecap="round" fill="none">
          <path d="M-34 18 L-72 84" stroke="#b45309" stroke-width="4"/>
          <path d="M34 18 L72 84" stroke="#b45309" stroke-width="4"/>
          <ellipse cx="-74" cy="87" rx="11" ry="4" fill="#1f2937" stroke="#b45309"/>
          <ellipse cx="74" cy="87" rx="11" ry="4" fill="#1f2937" stroke="#b45309"/>
        </g>

        <!-- flame -->
        <polygon fill="url(#flame)" points="-15,46 15,46 0,108">
          <animate attributeName="points" values="-15,46 15,46 0,100;-17,46 17,46 0,118;-15,46 15,46 0,106;-17,46 17,46 0,114;-15,46 15,46 0,100" dur="0.4s" repeatCount="indefinite"/>
        </polygon>
        <polygon fill="#ffffff" opacity=".9" points="-7,46 7,46 0,78">
          <animate attributeName="points" values="-7,46 7,46 0,74;-8,46 8,46 0,88;-7,46 7,46 0,78;-8,46 8,46 0,84;-7,46 7,46 0,74" dur="0.4s" repeatCount="indefinite"/>
        </polygon>

        <!-- nozzle -->
        <polygon points="-15,32 15,32 21,48 -21,48" fill="#374151" stroke="#1f2937"/>
        <ellipse cx="0" cy="48" rx="21" ry="4" fill="#f97316" opacity=".9"/>

        <!-- base band -->
        <polygon points="-56,18 56,18 46,36 -46,36" fill="#1f2937"/>
        <polygon points="-56,18 56,18 52,24 -52,24" fill="#374151"/>
        <line x1="-56" y1="18" x2="56" y2="18" stroke="#f59e0b" stroke-width="3"/>

        <!-- cabin -->
        <polygon points="-36,-68 -16,-68 -26,18 -56,18" fill="url(#cabinL)"/>
        <polygon points="-16,-68 16,-68 26,18 -26,18" fill="url(#cabinC)"/>
        <polygon points="16,-68 36,-68 56,18 26,18" fill="url(#cabinR)"/>
        <g stroke="#7f8fa8" stroke-width="1.2" fill="none" opacity=".9">
          <line x1="-16" y1="-68" x2="-26" y2="18"/>
          <line x1="16" y1="-68" x2="26" y2="18"/>
          <line x1="-22" y1="-18" x2="22" y2="-18"/>
        </g>
        <ellipse cx="0" cy="-69" rx="38" ry="10" fill="#1e293b"/>
        <ellipse cx="0" cy="-71" rx="30" ry="6.5" fill="#334155"/>
        <ellipse cx="0" cy="-78" rx="13" ry="5.5" fill="#cbd5e1" stroke="#94a3b8"/>
        <rect x="-15" y="-50" width="30" height="20" rx="5" fill="#0f1f3d" stroke="#60a5fa" stroke-width="1.6"/>
        <path d="M-11 -46 L-1 -46 L-7 -34 L-11 -34 Z" fill="#60a5fa" opacity=".45"/>
        <circle cx="42" cy="-26" r="5" fill="#0f1f3d" stroke="#60a5fa" stroke-width="1.4"/>
        <rect x="-34" y="-46" width="8" height="14" rx="2" fill="#0f1f3d" stroke="#60a5fa" stroke-width="1" transform="skewY(2)"/>
        <polygon points="-27,2 27,2 29,12 -29,12" fill="#f5b942" opacity=".9"/>
        <circle cx="0" cy="-84" r="2.6" fill="#f87171">
          <animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>

        <!-- front legs -->
        <g stroke-linecap="round" fill="none">
          <path d="M-52 -10 L-86 58" stroke="#d97706" stroke-width="3"/>
          <path d="M52 -10 L86 58" stroke="#d97706" stroke-width="3"/>
          <path d="M-50 16 L-108 94" stroke="#f59e0b" stroke-width="6"/>
          <path d="M50 16 L108 94" stroke="#f59e0b" stroke-width="6"/>
          <path d="M-51 15 L-107 92" stroke="#fde68a" stroke-width="1.8" opacity=".7"/>
          <path d="M49 15 L105 92" stroke="#fde68a" stroke-width="1.8" opacity=".7"/>
        </g>
        <ellipse cx="-112" cy="97" rx="17" ry="5.5" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
        <ellipse cx="112" cy="97" rx="17" ry="5.5" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
